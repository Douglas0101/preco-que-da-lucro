name: UI stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_RELEASE_CHANNEL: pre-beta-internal
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm install --global npm@11.14.1
      - run: npm ci
      - run: npm run check:ui-stack
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle
      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-evidence-${{ github.sha }}
          path: |
            .artifacts/bundle-report.json
            .artifacts/build-warnings.json
            .output/public/.vite/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            .artifacts/playwright-results.json
            playwright-report
            test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - run: npm audit --audit-level=high

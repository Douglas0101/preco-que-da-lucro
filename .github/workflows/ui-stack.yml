name: UI stack

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: preco_que_da_lucro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preco_que_da_lucro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUILD_RELEASE_CHANNEL: pre-beta-internal
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/preco_que_da_lucro_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preco_que_da_lucro_test
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      BETTER_AUTH_URL: http://127.0.0.1:4173
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:4173
      E2E_AUTH_EMAIL: teste@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.14.1
      - run: npm ci
      - run: npm run check:ui-stack
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run db:test
      - name: Configure isolated BFF runtime and E2E credentials
        shell: bash
        run: |
          runtime_password="$(openssl rand -hex 24)"
          auth_secret="$(openssl rand -hex 32)"
          auth_password="$(openssl rand -base64 24 | tr -d '\n')"
          {
            echo "DATABASE_URL=postgresql://app_runtime:${runtime_password}@127.0.0.1:5432/preco_que_da_lucro_test"
            echo "E2E_DB_RUNTIME_PASSWORD=${runtime_password}"
            echo "BETTER_AUTH_SECRET=${auth_secret}"
            echo "E2E_AUTH_PASSWORD=${auth_password}"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run check:bundle
      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-evidence-${{ github.sha }}
          path: |
            .artifacts/bundle-report.json
            .artifacts/build-warnings.json
            .output/public/.vite/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            .artifacts/playwright-results.json
            playwright-report
            test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - run: npm audit --audit-level=high

name: Neon PR branch CI

# PLANO_MESTRE §26 (item 28 da ordem prática §40): todo PR do próprio repo
# ganha uma branch Neon efêmera de zero linhas — CHILD `parent-data` da branch
# permanente vazia `ci-fixture-base` (schema copiado da base sem registros
# herdados), migrations via
# DIRECT obtida em runtime, integração, sonda RLS adversarial contra o DIRECT
# da branch e cleanup `always()` com prova. NUNCA usa o DATABASE_URL/secret de
# produção: a única credencial remota é a NEON_API_KEY (escopo branch), e a
# URI da branch é criada e destruída pelo próprio workflow.
#
# Gate de segurança (Emenda #2): hard-deny de produção permanece incondicional;
# aqui o alvo é sempre branch de drill (NEON_MIGRATION_TARGET_KIND=drill-branch,
# host ≠ produção), sancionado com motivo logado.
#
# Fork PRs: pulados pelo fork-guard ANTES de qualquer segredo (GitHub já não
# entrega secrets a forks; a dupla checagem é defesa em profundidade — §25).
# NEON_API_KEY ausente no repo: skip gracioso ROTULADO (gatilho da rodada),
# nunca fail silencioso.
#
# §12.4 (modelo de branch): production → develop → preview/pr-<n>. A fixture do
# PR copia a base vazia permanente `ci-fixture-base` (parent-data), nunca dados;
# o parent é explícito no POST e não depende do base_ref.
# §12.5 (schema diff): após as migrations, `compare_schema` compara a branch do
# PR com production (baseline read-only, a branch já carrega as migrations do
# PR) e persiste artefato + resumo em forma de comentário. Sem NEON_API_KEY o
# passo PULA COM RÓTULO (nunca fail silencioso) e o CI permanece verde.
#
# §12.5 (veredito, DBT-56): o veredito NÃO é mais "o diff saiu vazio?". Ele é de
# NÍVEL DE MIGRATION: `scripts/db/schema-diff-verdict.ts` lê o conjunto de hashes
# de `drizzle.__drizzle_migrations` na branch do PR e em production e decide
# pelos journals. Diff vazio com journals IGUAIS é o estado esperado da ordem
# expand-antes-de-promover (produção já migrada) e é `consistente`; diff vazio
# com produção ATRÁS é `INCONSISTENTE`; journal vazio ou leitura falha em
# qualquer ponta é `INCONSISTENTE` com o motivo nomeado (fail-closed, nunca
# igualdade inferida de uma leitura que não aconteceu). A lista de arquivos do
# PR qualifica a mensagem, não decide o veredito.
#
# §12.5 (ciclo de vida) + §26: fechado o provisionamento/migração/seed, o job
# roda o E2E (Playwright, mesma invocation do ui-stack.yml) contra a branch
# efêmera; o delete da branch segue no job `cleanup` com `always()`.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: neon-pr-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_API_BASE: https://console.neon.tech/api/v2

jobs:
  gate:
    name: Fork-guard + presença de segredo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide
        id: decide
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork-guard" >> "$GITHUB_OUTPUT"
            echo "- Neon PR branch CI: PULADO (fork-guard: head '$HEAD_REPO' ≠ repository '$BASE_REPO')" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$NEON_API_KEY" ] || [ -z "${NEON_PROJECT_ID:-damp-forest-57346541}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=secret-missing(SKIP-GRACIOSO-ROTULADO: configure NEON_API_KEY + vars.NEON_PROJECT_ID)" >> "$GITHUB_OUTPUT"
            echo "- Neon PR branch CI: PULADO com rótulo — NEON_API_KEY indisponível para o evento (skip gracioso rotulado, regra da rodada CUTOVER-PREP)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=same-repo-with-secrets" >> "$GITHUB_OUTPUT"

  branch-ci:
    name: Branch efêmera · migrate · integração · RLS probe · E2E
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull-requests:read apenas para rotular "o PR mexe em drizzle/**?" (§12.5);
    # o conteúdo do diff vem da API da Neon, não do token.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch_id: ${{ steps.create.outputs.branch_id }}
      probe_result: ${{ steps.probe.outputs.result }}
      schema_diff: ${{ steps.schema_diff.outputs.summary }}
      fixture_result: ${{ steps.fixture.outcome }}
      migrate_result: ${{ steps.migrate.outcome }}
      integration_result: ${{ steps.integration.outcome }}
      e2e_result: ${{ steps.e2e.outcome }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || 'damp-forest-57346541' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create ephemeral zero-row child via REST (parent-data from the empty ci-fixture-base)
        id: create
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # S6-R2/N04: provisionamento pela API REST oficial em vez do wrapper de
        # action — a recusa (ex.: HTTP 412) aparece com status/código sanitizado,
        # cada URI é mascarada na chegada (::add-mask::) e valores já conhecidos
        # são redigidos antes de qualquer log; o TTL de 24h vai no próprio POST e
        # o branch_id é entregue ao cleanup antes de qualquer espera por compute.
        # §12.4: a cópia é `parent-data` de `ci-fixture-base` (CHILD da base
        # vazia permanente): schema sem linhas herdadas — nunca cópia de dados,
        # nunca retry para dados. O provedor recusa toda cópia de schema neste
        # projeto (HTTP 412 em `schema-only` e `parent-schema`).
        run: npx --no-install tsx scripts/ci/provision-neon-fixture.ts

      - name: Verify fresh zero-row child (parent-data from ci-fixture-base) identity and prepare an empty migration fixture
        id: fixture
        env:
          BRANCH_ID: ${{ steps.create.outputs.branch_id }}
          BRANCH_CREATED: ${{ steps.create.outputs.created }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALLOW_REMOTE_DB: CI Neon parent-data child PR fixture sourced from the empty ci-fixture-base; zero inherited rows, no production or develop data
        run: npx --no-install tsx scripts/ci/prepare-neon-fixture.ts

      - name: Upload fixture identity and zero-row preparation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neon-pr-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neon-pr-provision.json
            ${{ runner.temp }}/neon-pr-fixture.json
          if-no-files-found: warn
          retention-days: 7

      - name: Migrations via DIRECT da branch (drill-branch, complete source chain)
        id: migrate
        run: |
          set -euo pipefail
          export DATABASE_ADMIN_URL="$(cat "$RUNNER_TEMP/branch_direct_url")"
          export NEON_MIGRATION_TARGET_KIND=drill-branch
          export ALLOW_REMOTE_DB="CI Neon PR branch ${{ github.event.pull_request.number }} — migrations em cópia efêmera (§26)"
          npm run db:migrate

      - name: Schema diff §12.5 (compare_schema + veredito por nível de migration)
        id: schema_diff
        env:
          BRANCH_ID: ${{ steps.create.outputs.branch_id }}
          BASE_BRANCH: production
          DB_NAME: neondb
          ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/neon-pr-branch/pr-${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          # H-2: sem NEON_API_KEY o passo PULA COM RÓTULO — nunca fail silencioso,
          # nunca credencial/project id presumido. O artefato registra o skip.
          if [ -z "${NEON_API_KEY:-}" ]; then
            printf '%s\n' \
              '# Schema diff §12.5 — PULADO' \
              '' \
              '- motivo: NEON_API_KEY ausente no evento (H-2) — compare_schema NAO foi chamado' \
              "- branch do PR: $BRANCH_ID · baseline: $BASE_BRANCH · db_name: $DB_NAME" \
              '- nenhuma chamada de rede foi feita; nenhuma chave ou project id foi presumido' \
              '- consequência: a semântica de baseline/empty-diff fica NÃO VERIFICADA até a chave existir' > "$ARTIFACT_DIR/schema-diff.md"
            echo "summary=PULADO (NEON_API_KEY ausente)" >> "$GITHUB_OUTPUT"
            echo "- Schema diff §12.5: PULADO com rótulo — NEON_API_KEY ausente (H-2); CI segue verde" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Rótulo de expectativa: o PR mexe em drizzle/**? Sem permissão → unknown
          # (o diff continua sendo medido pela API da Neon, só sem cross-check).
          DRIZZLE_TOUCHED=unknown
          if PR_FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' 2>/dev/null) && [ -n "$PR_FILES" ]; then
            if printf '%s\n' "$PR_FILES" | grep -q '^drizzle/'; then DRIZZLE_TOUCHED=yes; else DRIZZLE_TOUCHED=no; fi
          fi
          export DRIZZLE_TOUCHED

          # O veredito é de NÍVEL DE MIGRATION (DBT-56), não de vazio/não-vazio:
          # `scripts/db/schema-diff-verdict.ts` lê `drizzle.__drizzle_migrations`
          # nos dois lados e decide. Diff vazio com journals IGUAIS é o estado
          # esperado da ordem expand-antes-de-promover — o predicado antigo o
          # pintava de INCONSISTENTE. O passo só fala com `compare_schema` (para
          # o artefato bruto) e entrega o corpo ao módulo; o exit code e o
          # `summary` saem de lá.
          #
          # ALLOW_REMOTE_DB: a leitura da branch efêmera é remota e sancionada
          # (§26, cópia descartável) — motivo não-vazio, nunca presumido.
          export ALLOW_REMOTE_DB="CI Neon PR branch $PR_NUMBER — schema diff read-only na branch efêmera e na baseline de produção (§12.5)"
          export BRANCH_DIRECT_URL_FILE="$RUNNER_TEMP/branch_direct_url"
          export COMPARE_SCHEMA_BODY_FILE="$ARTIFACT_DIR/compare-schema-response.json"

          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from "node:fs";

          const apiBase = process.env.NEON_API_BASE;
          const projectId = process.env.NEON_PROJECT_ID;
          const dir = process.env.ARTIFACT_DIR;
          const headBranch = process.env.BRANCH_ID;
          const baseName = process.env.BASE_BRANCH;
          const dbName = process.env.DB_NAME;
          const request = (path) =>
            fetch(`${apiBase}${path}`, {
              headers: { Authorization: `Bearer ${process.env.NEON_API_KEY}` },
            });

          // Baseline = branch de produção. A API aceita nome ou id no path; o id
          // resolvido é preferido para não depender do nome canônico.
          let baseBranchId = baseName;
          const listed = await request(`/projects/${projectId}/branches`);
          if (listed.ok) {
            const { branches = [] } = await listed.json();
            baseBranchId =
              branches.find((branch) => branch.name === baseName)?.id ??
              branches.find((branch) => branch.default)?.id ??
              baseName;
          }

          const response = await request(
            `/projects/${projectId}/branches/${headBranch}/compare_schema` +
              `?base_branch_id=${encodeURIComponent(baseBranchId)}&db_name=${encodeURIComponent(dbName)}`,
          );
          const body = await response.text();
          writeFileSync(`${dir}/compare-schema-response.json`, body);

          if (!response.ok) {
            // Falha declarada, não silenciosa: o job já depende da API da Neon
            // para criar a branch, e o cleanup always() roda de todo modo.
            const failure = [
              "# Schema diff §12.5 — ERRO",
              "",
              `- compare_schema respondeu HTTP ${response.status} (corpo bruto em compare-schema-response.json)`,
              `- head: ${headBranch} · base: ${baseName} (${baseBranchId}) · db_name: ${dbName}`,
              "- a branch efêmera é removida de todo modo pelo cleanup always() (§12.5)",
            ].join("\n");
            writeFileSync(`${dir}/schema-diff.md`, `${failure}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `summary=ERRO (HTTP ${response.status})\n`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${failure}\n`);
            process.stderr.write(`compare_schema falhou: HTTP ${response.status}\n`);
            process.exit(1);
          }
          NODE

          npx tsx scripts/db/schema-diff-verdict.ts

      - name: Upload schema diff §12.5
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-pr-branch-schema-diff-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: .artifacts/neon-pr-branch
          # warn (não error): se o migrate falhar antes, o passo do diff não roda
          # e o job já está vermelho — a ausência do artefato não é o achado.
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Integração (suites db:test) contra a branch
        id: integration
        run: |
          set -euo pipefail
          export DATABASE_ADMIN_URL="$(cat "$RUNNER_TEMP/branch_direct_url")"
          export DATABASE_URL="$(cat "$RUNNER_TEMP/branch_pooled_url")"
          export ALLOW_REMOTE_DB="CI Neon PR branch ${{ github.event.pull_request.number }} — integração em branch efêmera (§26)"
          npm run db:test

      - name: Seed sintético + sonda RLS adversarial contra o DIRECT da branch (H-07)
        id: probe
        run: |
          set -euo pipefail
          export DATABASE_RESTORE_URL="$(cat "$RUNNER_TEMP/branch_direct_url")"
          export NEON_MIGRATION_TARGET_KIND=drill-branch
          export ALLOW_REMOTE_DB="CI Neon PR branch ${{ github.event.pull_request.number }} — RLS probe em cópia efêmera (§26)"
          if npm run m02:rls-probe -- --target-env DATABASE_RESTORE_URL --out /tmp/rls-probe-pr.md; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "4" ]; then echo "result=VIOLATION" >> "$GITHUB_OUTPUT"; else echo "result=ERROR-$code" >> "$GITHUB_OUTPUT"; fi
            exit "$code"
          fi

      - name: Prova de journal (read-only)
        run: |
          set -euo pipefail
          export DATABASE_ADMIN_URL="$(cat "$RUNNER_TEMP/branch_direct_url")"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { Client } from "pg";
            const expected = JSON.parse(readFileSync("drizzle/meta/_journal.json", "utf8")).entries.length;
            const c = new Client({ connectionString: process.env.DATABASE_ADMIN_URL, ssl: { rejectUnauthorized: true } });
            await c.connect();
            await c.query("start transaction read only");
            const r = await c.query("select count(*)::bigint as n from drizzle.__drizzle_migrations");
            await c.query("rollback");
            await c.end();
            console.log(JSON.stringify({ journal_count: Number(r.rows[0].n), expected }));
            process.exit(Number(r.rows[0].n) === expected ? 0 : 1);
          '

      # §12.5 (create → migrate → seed → integration → E2E) e §26 (o ciclo da
      # branch termina no E2E antes do delete). Mesma invocation do ui-stack.yml:
      # `npx playwright install --with-deps chromium firefox webkit` + `npm run
      # test:e2e`; o webServer do playwright.config.ts roda e2e:prepare, build e
      # preview em 127.0.0.1:4173. Sem `if:` próprio ⇒ condição de sucesso
      # default do job (depois de provisionar/migrar/seed); falha aqui deixa o
      # job vermelho e o cleanup `always()` roda de todo modo. Nenhum segredo
      # novo: runtime/auth são gerados no runner e a única credencial remota
      # segue sendo a NEON_API_KEY já entregue ao job — PR de fork nunca chega
      # aqui (fork-guard do job `gate`).
      - name: E2E Playwright contra a branch efêmera (§12.5 · §26.7)
        id: e2e
        run: |
          set -euo pipefail
          runtime_password="$(openssl rand -hex 24)"
          auth_secret="$(openssl rand -hex 32)"
          auth_password="$(openssl rand -base64 24 | tr -d '\n')"
          echo "::add-mask::${runtime_password}"
          echo "::add-mask::${auth_secret}"
          echo "::add-mask::${auth_password}"
          export DATABASE_ADMIN_URL="$(cat "$RUNNER_TEMP/branch_direct_url")"
          # DATABASE_URL = app_runtime sobre o pooler da branch (mesmo papel que o
          # ui-stack.yml usa no E2E): e2e:prepare re-escreve a senha do papel com
          # E2E_DB_RUNTIME_PASSWORD. DATABASE_DRIVER fica intencionalmente não
          # definido para exercitar o driver de produção (neon-serverless).
          export DATABASE_URL="$(
            BRANCH_POOLED_URL="$(cat "$RUNNER_TEMP/branch_pooled_url")" \
              RUNTIME_PASSWORD="$runtime_password" \
              node --input-type=module -e '
                const url = new URL(process.env.BRANCH_POOLED_URL);
                url.username = "app_runtime";
                url.password = process.env.RUNTIME_PASSWORD;
                process.stdout.write(url.toString());
              '
          )"
          export E2E_DB_RUNTIME_PASSWORD="$runtime_password"
          export BETTER_AUTH_SECRET="$auth_secret"
          export E2E_AUTH_EMAIL="teste@example.test"
          export E2E_AUTH_PASSWORD="$auth_password"
          export BETTER_AUTH_URL="http://127.0.0.1:4173"
          export AUTH_TRUSTED_ORIGINS="http://127.0.0.1:4173"
          # O env-guard é fail-closed contra banco remoto em test:e2e/e2e:prepare;
          # o alvo aqui é a branch efêmera (drill), nunca produção.
          export ALLOW_REMOTE_DB="CI Neon PR branch ${{ github.event.pull_request.number }} — E2E em branch efêmera (§26)"
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e

  cleanup:
    name: Cleanup always() com prova (§12.5)
    needs: [gate, branch-ci]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || 'damp-forest-57346541' }}
    steps:
      - name: Delete branch efêmera
        id: delete
        if: needs.branch-ci.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID || 'damp-forest-57346541' }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ needs.branch-ci.outputs.branch_id }}

      - name: Prova de cleanup + comentário no PR
        if: always()
        env:
          BRANCH_ID: ${{ needs.branch-ci.outputs.branch_id }}
          PROBE_RESULT: ${{ needs.branch-ci.outputs.probe_result }}
          SCHEMA_DIFF: ${{ needs.branch-ci.outputs.schema_diff }}
          CI_RESULT: ${{ needs.branch-ci.result }}
          FIXTURE_RESULT: ${{ needs.branch-ci.outputs.fixture_result }}
          MIGRATE_RESULT: ${{ needs.branch-ci.outputs.migrate_result }}
          INTEGRATION_RESULT: ${{ needs.branch-ci.outputs.integration_result }}
          E2E_RESULT: ${{ needs.branch-ci.outputs.e2e_result }}
          DELETE_RESULT: ${{ steps.delete.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # HTTP 403 é falta de acesso, nunca prova de ausência. O classificador
          # mantém veredito (1) distinto de precondição/NO-VERDICT (2).
          cleanup_verdict() {
            case "$1" in
              404) printf 'confirmado (GET pós-delete = HTTP 404)'; return 0 ;;
              200) printf 'NAO-CONFIRMADO — branch ainda existe (HTTP 200)'; return 1 ;;
              *) printf 'NAO-CONFIRMADO — leitura inconclusiva (HTTP %s)' "$1"; return 2 ;;
            esac
          }
          # Guardas de protocolo, sem rede: regressão em código OU rótulo reprova.
          for fixture in '404:0:confirmado' '403:2:NAO-CONFIRMADO' '200:1:NAO-CONFIRMADO' '000:2:NAO-CONFIRMADO'; do
            IFS=: read -r response expected_code expected_label <<< "$fixture"
            observed_code=0
            observed_label="$(cleanup_verdict "$response")" || observed_code=$?
            if [[ "$observed_code" != "$expected_code" || "$observed_label" != "$expected_label"* ]]; then
              echo "cleanup protocol guard falhou para HTTP $response" >&2
              exit 1
            fi
          done
          echo 'cleanup protocol guard: 404/403/200/000 PASS'
          CLEANUP_CODE=0
          if [ -n "$BRANCH_ID" ]; then
            # `curl -f` sai 22 em HTTP >= 400 e, sob `pipefail`, derruba o
            # pipeline no próprio 404 que confirma o delete. Falha de rede
            # vira 000 e reprova como NO-VERDICT, sem falso verde.
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' \
              "$NEON_API_BASE/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
              -H "Authorization: Bearer $NEON_API_KEY")" || HTTP_CODE=000
            DELETED="$(cleanup_verdict "$HTTP_CODE")" || CLEANUP_CODE=$?
          else
            DELETED="NAO-EXECUTADO — branch_id ausente; sem prova de criação ou descarte"
            CLEANUP_CODE=2
          fi
          {
            echo "## Neon PR branch CI — resultado"
            echo
            echo "- jobs: \`$CI_RESULT\` · sonda RLS (H-07, seeded sintético marcador \`@preco-que-da.test\`): \`${PROBE_RESULT:-n/a}\`"
            echo "- Schema diff §12.5 vs produção: \`${SCHEMA_DIFF:-n/a}\`"
            echo "- Branch efêmera \`${BRANCH_ID:-não identificada}\`: cleanup — $DELETED (§12.5 always())"
            echo "- Etapas observadas: fixture \`${FIXTURE_RESULT:-n/a}\` · migrations \`${MIGRATE_RESULT:-n/a}\` · integração \`${INTEGRATION_RESULT:-n/a}\` · E2E \`${E2E_RESULT:-n/a}\`."
            echo "- Delete: \`${DELETE_RESULT:-n/a}\`; somente GET pós-delete HTTP 404 confirma descarte."
            echo "- Alvo autorizado: branch efêmera parent-data child da base vazia ci-fixture-base (zero linhas herdadas); nenhum sucesso de etapa é presumido a partir do resultado do job."
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ### Neon PR branch CI
          - Resultado dos jobs: \`$CI_RESULT\`
          - Sonda RLS adversarial (H-07): \`${PROBE_RESULT:-n/a}\`
          - Schema diff §12.5 vs produção (baseline read-only): \`${SCHEMA_DIFF:-n/a}\`

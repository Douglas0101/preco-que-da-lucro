name: Neon preview database

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Detect Neon configuration
        id: config
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Neon preview skipped: configure NEON_API_KEY and NEON_PROJECT_ID."
          fi

      - name: Record skipped preview boundary
        if: steps.config.outputs.enabled != 'true'
        run: |
          {
            echo "### Neon preview"
            echo
            echo "Skipped because NEON_API_KEY and/or NEON_PROJECT_ID is not configured."
            echo "A skipped optional preview is not evidence of a Neon branch, migration, reconciliation, backup/restore, or cutover."
            echo 'Use the protected manual `Neon readiness` workflow after configuring the required credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create ephemeral Neon branch
        id: neon
        if: steps.config.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH || 'develop' }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ADMIN_ROLE || 'neondb_owner' }}

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Validate migrations on Neon
        if: steps.config.outputs.enabled == 'true'
        env:
          DATABASE_ADMIN_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: npm run db:test

      - name: Validate migration drift
        if: steps.config.outputs.enabled == 'true'
        env:
          DATABASE_ADMIN_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:check

      - name: Delete ephemeral Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}

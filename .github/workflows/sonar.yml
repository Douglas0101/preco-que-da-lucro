name: SonarCloud (scanner + cobertura)

# Por que este workflow existe: a *Automatic Analysis* do SonarCloud analisa o repositório, mas
# **não aceita relatório de cobertura** — ela não roda ferramenta externa. Enquanto ela era o único
# caminho, o gate media `new_coverage` = 0 e reprovava (`DBT-57`). O `sonar-scanner` aceita o
# relatório, então a cobertura passa a ser medida aqui.
#
# Correção de premissa, medida: `DBT-57` fala em `sonar.coverageReportPaths`, mas essa propriedade
# espera o **formato genérico de cobertura do SonarQube (XML)** — não lcov. Para lcov em JS/TS a
# propriedade correta é `sonar.javascript.lcov.reportPaths`, e é ela que este workflow usa.
#
# Escopo (`DBT-58`): `sonar.sources=src`. `scripts/**` está fora porque a organização está na cota
# de 50.000 LOC do plano gratuito e `scripts/` sozinho tem 34.972 LOC. O limite é declarado em
# `ADR-034`/`ADR-035` — não é uma escolha de qualidade.

on:
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/evidence/**"
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: scan + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O scanner precisa do histórico: sem profundidade suficiente ele não resolve o SCM e o
          # log traz "No SCM system was detected", o que degrada a atribuição de autoria.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Instalar (como o CI instala)
        run: npm ci --ignore-scripts

      - name: Suíte com cobertura (lcov)
        run: npm run test:coverage

      - name: Conferir o relatório antes de enviar
        run: |
          set -euo pipefail
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info ausente ou vazio — o analyze mediria 0% de novo"
            exit 1
          fi
          echo "lcov.info: $(wc -c < coverage/lcov.info) bytes"

      - name: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN ausente — configure o secret do repositório"
            exit 1
          fi

          # DBT-61: sem atribuição explícita, o scanner grava TODA análise como `main` — a árvore de
          # `develop` sobrescrevia a análise de `main` e o "código novo" do gate era medido contra um
          # histórico que não era o da branch analisada. Medido antes do fix: análise de `revision
          # 2d73fa3` (commit de develop) arquivada sob `main`, e `develop` como "nunca analisada".
          #
          # O ramo importa: uma PR sem `sonar.pullrequest.*` produziria análise de branch gravada como
          # `main` de novo — verde com a atribuição errada, que é o defeito renascendo.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ATRIBUICAO=(
              "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
              "-Dsonar.pullrequest.branch=${{ github.head_ref }}"
              "-Dsonar.pullrequest.base=${{ github.base_ref }}"
            )
            echo "atribuicao: pull request #${{ github.event.pull_request.number }} (${{ github.head_ref }} -> ${{ github.base_ref }})"
          else
            ATRIBUICAO=("-Dsonar.branch.name=${GITHUB_REF_NAME}")
            echo "atribuicao: branch ${GITHUB_REF_NAME}"
          fi

          docker run --rm \
            -e SONAR_TOKEN \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=Douglas0101_preco-que-da-lucro \
            -Dsonar.organization=douglas0101 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src \
            -Dsonar.exclusions='src/test/**' \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.scm.provider=git \
            "${ATRIBUICAO[@]}"

      - name: Guardar o lcov como artefato
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

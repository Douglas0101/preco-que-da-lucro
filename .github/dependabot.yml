# C26: automatic version PR creation disabled; engineering applies updates in develop.
# Security alerts are enabled; automatic security PRs are disabled in GitHub settings.
# Groups document coupled families; current main config changes only at final release.
# Dependabot — atualizações de VERSÃO (version updates) deste repositório.
# Plano Mestre §25 ("Adicionar quando disponível: Dependabot") ·
# docs/PLANO_MESTRE_OTIMIZACOES_VALIDADO_WEB_PRECO_QUE_DA_LUCRO.md.
# Referência de campos obrigatórios (`version`, `updates`, `package-ecosystem`,
# `directory`, `schedule.interval`) e de `directory: "/"` para o ecossistema
# `github-actions`:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# ESCOPO REPO-LOCAL: este arquivo habilita apenas PRs de atualização versionada.
# *Dependabot alerts* e *Dependabot security updates* NÃO são configuráveis por
# arquivo — são settings do GitHub (dependency graph ligado no repo + alerts/
# security updates habilitados em Settings → Code security), portanto vivem na
# fila humana. Classificação item a item de §25:
# docs/evidence/supply-chain-classification-2026-09-15.md.
#
# O ecossistema `github-actions` reescreve o SHA completo já pinado nas
# workflows, preservando §25 "Actions pinadas por SHA" sem intervenção manual.

version: 2
updates:
  # npm: package.json + package-lock.json na raiz (único manifest do repo).
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      react-runtime-and-types:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tanstack-router-start:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/react-start"
          - "@tanstack/react-start-*"
          - "@tanstack/router-*"
          - "@tanstack/start-*"
          - "@tanstack/history"

  # github-actions: `directory: "/"` faz o Dependabot varrer /.github/workflows
  # e o action.yml/action.yaml da raiz.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

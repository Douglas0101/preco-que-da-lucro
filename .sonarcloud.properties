# SonarCloud Automatic Analysis configuration.
#
# A organização está no plano gratuito: 50.000 linhas de código. Medido em 2026-09-30, a árvore da
# release tem 58.226 LOC contra 35.666 do `main`, então **toda** análise do PR de release era
# recusada pela cota antes de inspecionar um único arquivo — cinco tarefas consecutivas falharam com
# "This analysis will make your organization 'douglas0101' reach the maximum allowed lines limit of
# 50000". O gate não ficava vermelho nem verde: não ficava nada.
#
# As exclusões abaixo são, portanto, exclusões de **cota** — e são declaradas, nunca silenciosas:
#   drizzle/**  — migrations imutáveis já aplicadas e snapshots gerados (drizzle/meta/*.json ≈ 29k
#                 LOC), nunca editados à mão.
#   src/test/** — fontes de teste (≈ 22,8k linhas). A autoridade sobre testes é `npm run test` e o
#                 tier de CI, que os executam; o gate de qualidade é sobre código de produção.
#   e2e/**      — specs do Playwright, executadas pelo tier de e2e do `ui-stack`.
#
# Redução de escopo por decisão do MAESTRO no Ciclo 18, registrada em `ADR-034` e `DBT-54`. Ela
# remove exatamente **um** dos 69 achados de confiabilidade corrigidos em `eff4f99`
# (`e2e/visual/visual-capture.ts`); os outros 68 valem por mérito próprio, e nenhum foi marcado
# como falso positivo.
sonar.exclusions=drizzle/**,src/test/**,e2e/**
